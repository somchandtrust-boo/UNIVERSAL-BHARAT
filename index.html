<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
}

#space{
    position:fixed;
    inset:0;
}

canvas{
    display:block;
}

.hud{
    position:fixed;
    z-index:20;
    pointer-events:none;
}

.logo{
    top:18px;
    left:20px;
    font-size:20px;
    font-weight:800;
    letter-spacing:4px;
    color:#fff;
    text-shadow:
        0 0 8px #58bfff,
        0 0 18px #237cff;
}

.live{
    top:18px;
    right:20px;
    padding:8px 12px;
    border:1px solid rgba(100,190,255,.45);
    background:rgba(0,10,25,.55);
    border-radius:10px;
    font-size:10px;
    letter-spacing:1.5px;
    color:#9fdcff;
}

.status{
    bottom:18px;
    left:18px;
    padding:8px 12px;
    background:rgba(0,8,18,.65);
    border:1px solid rgba(90,180,255,.25);
    border-radius:10px;
    font-size:11px;
    color:#b8ddff;
}

.menuBtn{
    position:fixed;
    z-index:40;
    right:18px;
    bottom:18px;
    width:54px;
    height:54px;
    border-radius:50%;
    border:1px solid rgba(100,210,255,.7);
    background:rgba(3,15,30,.88);
    color:#fff;
    font-size:23px;
    cursor:pointer;
    box-shadow:
        0 0 15px rgba(40,150,255,.35),
        inset 0 0 15px rgba(50,140,255,.12);
}

.controls{
    position:fixed;
    z-index:35;
    right:82px;
    bottom:18px;
    width:300px;
    padding:15px;
    border-radius:18px;
    border:1px solid rgba(100,200,255,.35);
    background:rgba(2,10,22,.88);
    backdrop-filter:blur(14px);
    box-shadow:0 0 30px rgba(0,120,255,.2);
    transform:translateY(20px) scale(.96);
    opacity:0;
    pointer-events:none;
    transition:.25s ease;
}

.controls.open{
    transform:translateY(0) scale(1);
    opacity:1;
    pointer-events:auto;
}

.controlTitle{
    font-size:11px;
    letter-spacing:2px;
    color:#82cfff;
    margin-bottom:10px;
}

.speedRow{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}

button.ctrl{
    flex:1;
    min-width:45px;
    border:1px solid rgba(100,190,255,.3);
    background:rgba(20,50,80,.5);
    color:#fff;
    padding:9px 7px;
    border-radius:9px;
    cursor:pointer;
}

button.ctrl:hover{
    background:rgba(40,100,160,.7);
}

.soundState{
    margin-top:12px;
    padding:9px;
    border-radius:9px;
    border:1px solid rgba(100,190,255,.25);
    color:#b9ddff;
    font-size:11px;
    text-align:center;
}

.info{
    position:fixed;
    z-index:50;
    top:0;
    right:0;
    width:min(410px,94vw);
    height:100%;
    padding:22px;
    background:rgba(2,8,18,.94);
    backdrop-filter:blur(18px);
    border-left:1px solid rgba(100,190,255,.3);
    overflow-y:auto;
    transform:translateX(100%);
    transition:.3s ease;
}

.info.open{
    transform:translateX(0);
}

.closeInfo{
    position:absolute;
    right:15px;
    top:15px;
    width:38px;
    height:38px;
    border-radius:50%;
    border:1px solid rgba(100,190,255,.35);
    background:rgba(20,40,65,.7);
    color:#fff;
    cursor:pointer;
    font-size:18px;
}

.infoName{
    margin-top:45px;
    font-size:28px;
    font-weight:800;
    letter-spacing:2px;
    color:#fff;
}

.infoType{
    color:#75caff;
    font-size:11px;
    letter-spacing:2px;
    margin-top:5px;
    margin-bottom:18px;
}

.section{
    margin-top:18px;
}

.sectionTitle{
    color:#69c7ff;
    font-size:10px;
    letter-spacing:2px;
    margin-bottom:8px;
}

.dataGrid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
}

.dataBox{
    padding:10px;
    border-radius:9px;
    background:rgba(20,40,65,.42);
    border:1px solid rgba(100,180,255,.15);
}

.dataBox span{
    display:block;
    font-size:9px;
    color:#7192ad;
    margin-bottom:3px;
}

.dataBox b{
    font-size:12px;
    color:#e8f6ff;
}

.description{
    font-size:12px;
    line-height:1.6;
    color:#c5d7e5;
}

.label{
    position:absolute;
    color:#fff;
    font-size:11px;
    font-weight:700;
    letter-spacing:1px;
    pointer-events:none;
    text-shadow:
        0 0 4px #000,
        0 0 8px #000;
    white-space:nowrap;
}

@media(max-width:600px){
    .logo{
        left:12px;
        top:12px;
        font-size:16px;
    }

    .live{
        right:12px;
        top:12px;
        font-size:8px;
    }

    .controls{
        left:10px;
        right:10px;
        bottom:82px;

    }

        left:10px;
        bottom:15px;
        font-size:9px;

    .menuBtn{
        right:12px;
        bottom:12px;
    }

   STAR FIELD
   ========================================================= */

const starGeometry = new THREE.BufferGeometry();

const starCount = 45000;

const starPositions = new Float32Array(starCount * 3);

for(let i=0;i<starCount;i++){

    const r = 900 + Math.random()*1200;

    const theta = Math.random()*Math.PI*2;

    const phi = Math.acos(
        2*Math.random()-1
    );

    starPositions[i*3] =
        r*Math.sin(phi)*Math.cos(theta);

    starPositions[i*3+1] =
        r*Math.cos(phi);

    starPositions[i*3+2] =
        r*Math.sin(phi)*Math.sin(theta);
}

starGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        starPositions,
        3
    )
);

const starMaterial = new THREE.PointsMaterial({
    color:0xffffff,
    size:.8,
    sizeAttenuation:true
});

const stars = new THREE.Points(
    starGeometry,
    starMaterial
);

scene.add(stars);

/* =========================================================

const bodies={};

const planetGroups={};

function createOrbit(radius,color){

    const points=[];

    for(let i=0;i<=256;i++){

        const a =
            (i/256)*Math.PI*2;

        points.push(
            new THREE.Vector3(
                Math.cos(a)*radius,
                0,
                Math.sin(a)*radius
            )
        );
    }

    const geometry =
        new THREE.BufferGeometry()
        .setFromPoints(points);

    const material =
        new THREE.LineBasicMaterial({

            color:color,

            transparent:true,

            opacity:.30
        });

    return new THREE.LineLoop(
        geometry,
        material
    );
}


function createPlanet(data){

    const group =
        new THREE.Group();

    scene.add(group);

    const orbit =
        createOrbit(
            data.orbit,
            data.color
        );

    scene.add(orbit);

    const geometry =
        new THREE.SphereGeometry(
            data.radius,
            48,
            48
        );

    const material =
        makePlanetMaterial(
            data.color
        );

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    group.add(mesh);

    mesh.userData.key=data.key;

    /* subtle natural surface variation */
    const detailGeometry =
        new THREE.SphereGeometry(
            data.radius*1.002,
            48,
            48
        );

    const detailMaterial =
        new THREE.MeshStandardMaterial({

            color:data.color,

            roughness:1,

            metalness:0,

            transparent:true,

            opacity:.14
        });

    const detail =
        new THREE.Mesh(
            detailGeometry,
            detailMaterial
        );

    group.add(detail);


    /* special atmospheric shell */

    if(data.key==="Earth"){

        const atmosphere =
            new THREE.Mesh(

                new THREE.SphereGeometry(
                    data.radius*1.10,
                    48,
                    48
                ),

                new THREE.MeshBasicMaterial({

                    color:0x4ba8ff,

                    transparent:true,

                    opacity:.12,

                    side:THREE.BackSide
                })
            );

        group.add(atmosphere);
    }


    /* Jupiter / Saturn natural bands */

    if(data.bands){

        for(let i=-3;i<=3;i++){

            const band =
                new THREE.Mesh(

                    new THREE.TorusGeometry(
                        data.radius*0.98,
                        data.radius*.025,
                        8,
                        64
                    ),

                    new THREE.MeshBasicMaterial({

                        color:
                            i%2===0
                            ? 0x8b654b
                            : 0xd2ad7c,

                        transparent:true,

                        opacity:.24
                    })
                );

            band.rotation.x =
                Math.PI/2;

            band.position.y =
                i*data.radius*.13;

            group.add(band);
        }
    }


    bodies[data.key]={
        group,
        mesh,
        data
    };

    planetGroups[data.key]=group;
}


PLANETS.forEach(createPlanet);


/* =========================================================

const saturn =

if(saturn){

/* =========================================================
   MOON CREATION
   ========================================================= */

const satellites={};

function createMoonOrbit(
    parent,
    radius,
    color
){

    const points=[];

    for(let i=0;i<=128;i++){

        const a=
            i/128*Math.PI*2;

        points.push(

            new THREE.Vector3(
                Math.cos(a)*radius,
                0,
                Math.sin(a)*radius
            )
        );
    }

    const geometry =
        new THREE.BufferGeometry()
        .setFromPoints(points);

    const material =
        new THREE.LineBasicMaterial({

            color:color,

            transparent:true,

            opacity:.18
        });

    const line =
        new THREE.LineLoop(
            geometry,
            material
        );

    parent.add(line);
}


function createMoon(data,index){

    const parent =
        planetGroups[data.parent];

    if(!parent)return;

    const group =
        new THREE.Group();

    group.position.x =
        data.distanceLocal;

    parent.add(group);

    createMoonOrbit(
        parent,
        data.distanceLocal,
        data.color
    );

    const geometry =
        new THREE.SphereGeometry(
            data.radius,
            32,
            32
        );

    const material =
        makePlanetMaterial(
            data.color
        );

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    group.add(mesh);

    mesh.userData.key =
        data.key;

    satellites[data.key]={
        group,
        mesh,
        data
    };
}


MOONS.forEach(createMoon);


/* =========================================================
   LABEL SYSTEM
   ========================================================= */

const labelLayer =
    document.createElement("div");

labelLayer.style.position="fixed";
labelLayer.style.inset="0";
labelLayer.style.pointerEvents="none";
labelLayer.style.zIndex="10";

document.body.appendChild(labelLayer);

const labels={};

function createLabel(key){

    const el =
        document.createElement("div");

    el.className="label";

    el.textContent=key;

    labelLayer.appendChild(el);

    labels[key]=el;
}

PLANETS.forEach(p=>createLabel(p.key));

MOONS.forEach(m=>createLabel(m.key));

function worldPosition(key){

    if(key==="Sun")
        return sun.position.clone();

    if(bodies[key]){

        return bodies[key].group
            .getWorldPosition(
                new THREE.Vector3()
            );
    }

    if(satellites[key]){

        return satellites[key].group
            .getWorldPosition(
                new THREE.Vector3()
            );
    }

    return null;
}

function updateLabels(){

    Object.keys(labels).forEach(key=>{

        const pos =
            worldPosition(key);

        if(!pos)return;

        pos.project(camera);

        const x =
            (pos.x*.5+.5)*innerWidth;

        const y =
            (-pos.y*.5+.5)*innerHeight;

        labels[key].style.transform =
            `translate(${x+8}px,${y-10}px)`;

        labels[key].style.opacity =
            pos.z < 1 ? "1" : "0";
    });
}


/* =========================================================
   ANIMATION
   ========================================================= */

let running=true;

let timeScale=1;

const clock =
    new THREE.Clock();

function animate(){

    requestAnimationFrame(animate);

    const delta =
        clock.getDelta();

    if(running){

        const t =
            delta*timeScale;

        PLANETS.forEach(p=>{

            const b =
                bodies[p.key];

            const angle =
                performance.now()*.00001*
                p.speed*100*
                timeScale;

            b.group.position.x =
                Math.cos(angle)*p.orbit;

            b.group.position.z =
                Math.sin(angle)*p.orbit;

            b.mesh.rotation.y +=
                delta*.2*timeScale;
        });


        MOONS.forEach((m,i)=>{

            const s =
                satellites[m.key];

            if(!s)return;

            const speed =
                .00008*
                (i+1)*
                timeScale;

            const angle =
                performance.now()*speed;

            s.group.position.x =
                Math.cos(angle)*
                m.distanceLocal;

            s.group.position.z =
                Math.sin(angle)*
                m.distanceLocal;

            s.mesh.rotation.y +=
                delta*.3*timeScale;
        });

        sun.rotation.y +=
            delta*.03*timeScale;

        stars.rotation.y +=
            delta*.00003*timeScale;
    }

    controls.update();

    updateLabels();

    renderer.render(
        scene,
        camera
    );
}

animate();


/* =========================================================
   SELECTION
   ========================================================= */

const raycaster =
    new THREE.Raycaster();

const pointer =
    new THREE.Vector2();

let selected=null;

const selectionRing =
    new THREE.Mesh(

        new THREE.RingGeometry(
            1,
            1.08,
            48
        ),

        new THREE.MeshBasicMaterial({

            color:0x55c8ff,

            side:THREE.DoubleSide,

            transparent:true,

            opacity:.85
        })
    );

selectionRing.visible=false;

scene.add(selectionRing);


function getSelectedMesh(key){

    if(key==="Sun")
        return sun;

    if(bodies[key])
        return bodies[key].mesh;

    if(satellites[key])
        return satellites[key].mesh;

    return null;
}


function selectBody(key){

    selected=key;

    const mesh =
        getSelectedMesh(key);

    if(mesh){

        selectionRing.visible=true;

        selectionRing.position.copy(
            mesh.getWorldPosition(
                new THREE.Vector3()
            )
        );

        const r =
            mesh.geometry.parameters.radius ||
            1;

        selectionRing.scale.setScalar(
            r*1.35
        );
    }

    openInfo(key);

    focusBody(key);
}


/* =========================================================
   CAMERA FOCUS
   ========================================================= */

function focusBody(key){

    let pos;

    if(key==="Sun"){

        pos=sun.position.clone();

    }else{

        pos=worldPosition(key);
    }

    if(!pos)return;

    const distance =
        key==="Sun"
        ? 45
        : key in satellites
        ? 15
        : 25;

    const direction =
        new THREE.Vector3(
            .7,
            .45,
            1
        ).normalize();

    const target =
        pos.clone();

    const cameraPos =
        pos.clone().add(
            direction.multiplyScalar(
                distance
            )
        );

    camera.position.copy(
        cameraPos
    );

    controls.target.copy(
        target
    );
}


/* =========================================================
   INFORMATION PANEL
   ========================================================= */

const info =
    document.getElementById("info");

const infoName =
    document.getElementById("infoName");

const infoType =
    document.getElementById("infoType");

const distance =
    document.getElementById("distance");

const period =
    document.getElementById("period");

const diameter =
    document.getElementById("diameter");

const gravity =
    document.getElementById("gravity");

const weather =
    document.getElementById("weather");

const history =
    document.getElementById("history");

const fact =
    document.getElementById("fact");


const SUN_DATA={

    type:"STAR",

    distance:"149.6 million km from Earth",

    period:"~25–35 days rotation",

    diameter:"1,392,700 km",

    gravity:"274 m/s²",

    weather:"Extremely hot plasma with sunspots, solar flares and coronal mass ejections.",

    history:"Observed by humanity throughout history and studied by many solar missions.",

    fact:"The Sun contains most of the Solar System's mass."
};


function openInfo(key){

    let data;

    if(key==="Sun"){

        data=SUN_DATA;

        infoName.textContent="SUN";

        infoType.textContent="STAR";

    }else if(bodies[key]){

        data=bodies[key].data;

        infoName.textContent=
            data.key.toUpperCase();

        infoType.textContent=
            data.type;

    }else if(satellites[key]){

        data=satellites[key].data;

        infoName.textContent=
            data.key.toUpperCase();

        infoType.textContent=
            "NATURAL SATELLITE";

    }else{

        return;
    }

    distance.textContent=
        data.distance || 
        `Orbiting ${data.parent}`;

    period.textContent=
        data.period;

    diameter.textContent=
        data.diameter;

    gravity.textContent=
        data.gravity;

    weather.textContent=
        data.weather;

    history.textContent=
        data.history;

    fact.textContent=
        data.fact;

    info.classList.add("open");

    document.getElementById("status")
        .textContent=
        `${key} SELECTED • SPACE DATA ACTIVE`;
}


/* =========================================================
   CLICK DETECTION
   ========================================================= */

renderer.domElement.addEventListener(
    "pointerdown",
    event=>{

        pointer.x =
            (event.clientX/innerWidth)*2-1;

        pointer.y =
            -(event.clientY/innerHeight)*2+1;

        raycaster.setFromCamera(
            pointer,
            camera
        );

        const objects=[
            sun,
            ...PLANETS.map(
                p=>bodies[p.key].mesh
            ),
            ...MOONS.map(
                m=>satellites[m.key].mesh
            )
        ];

        const hits =
            raycaster.intersectObjects(
                objects,
                true
            );

        if(hits.length){

            const key =
                hits[0].object.userData.key;

            if(key)
                selectBody(key);
        }
    }
);

/* =========================================================
   CLEAR DEEP SPACE AUDIO
   ========================================================= */

let audioContext=null;
let masterGain=null;
let audioStarted=false;

function startSpaceAudio(){

    if(audioStarted)return;

    audioStarted=true;

    try{

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

        masterGain =
            audioContext.createGain();

        masterGain.gain.value=.075;

        masterGain.connect(
            audioContext.destination
        );


        /* deep-space low tone */

        const bass =
            audioContext.createOscillator();

        const bassGain =
            audioContext.createGain();

        bass.type="sine";

        bass.frequency.value=38;

        bassGain.gain.value=.55;

        bass.connect(bassGain);

        bassGain.connect(masterGain);

        bass.start();


        /* harmonic layer */

        const harmonic =
            audioContext.createOscillator();

        const harmonicGain =
            audioContext.createGain();

        harmonic.type="sine";

        harmonic.frequency.value=76;

        harmonicGain.gain.value=.18;

        harmonic.connect(
            harmonicGain
        );

        harmonicGain.connect(
            masterGain
        );

        harmonic.start();


        /* slow movement */

        const lfo =
            audioContext.createOscillator();

        const lfoGain =
            audioContext.createGain();

        lfo.type="sine";

        lfo.frequency.value=.045;

        lfoGain.gain.value=9;

        lfo.connect(lfoGain);

        lfoGain.connect(
            bass.frequency
        );

        lfo.start();


        /* soft space noise */

        const bufferSize =
            audioContext.sampleRate*2;

        const buffer =
            audioContext.createBuffer(
                1,
                bufferSize,
                audioContext.sampleRate
            );

        const data =
            buffer.getChannelData(0);

        for(let i=0;i<bufferSize;i++){

            data[i]=
                (Math.random()*2-1);
        }

        const noise =
            audioContext.createBufferSource();

        noise.buffer=buffer;

        noise.loop=true;

        const filter =
            audioContext.createBiquadFilter();

        filter.type="lowpass";

        filter.frequency.value=650;

        const noiseGain =
            audioContext.createGain();

        noiseGain.gain.value=.035;

        noise.connect(filter);

        filter.connect(noiseGain);

        noiseGain.connect(masterGain);

        noise.start();


        if(audioContext.state==="suspended"){

            audioContext.resume();
        }

        document.getElementById(
            "soundState"
        ).textContent=
            "🔊 SPACE AUDIO ON";

    }catch(error){

        console.log(
            "Audio error:",
            error
        );

        document.getElementById(
            "soundState"
        ).textContent=
            "🔇 AUDIO BLOCKED BY BROWSER";
    }
}


/* =========================================================
   AUDIO UNLOCK
   ========================================================= */

window.addEventListener(
    "pointerdown",
    startSpaceAudio,
    {
        once:true
    }
);

window.addEventListener(
    "keydown",
    startSpaceAudio,
    {
        once:true
    }
);


/* =========================================================
   SOUND BUTTON
   ========================================================= */

document.getElementById(
    "soundState"
).addEventListener(
    "click",
    async()=>{

        if(!audioStarted){

            startSpaceAudio();

            return;
        }

        if(!audioContext)return;

        if(
            audioContext.state==="running"
        ){

            await audioContext.suspend();

            document.getElementById(
                "soundState"
            ).textContent=
                "🔇 SPACE AUDIO OFF";

        }else{

            await audioContext.resume();

            document.getElementById(
                "soundState"
            ).textContent=
                "🔊 SPACE AUDIO ON";
        }
    }
);

    ()=>{

        camera.aspect =
            innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

document.getElementById("status")
